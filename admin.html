<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة آراء AiWay</title><link rel="icon" href="./aiway-logo.png">
<style>
:root{--p:#6f2dbd;--p2:#9657df;--bg:#faf8fd;--ink:#24172f;--muted:#776d80;--line:#eadff2;--white:#fff;--shadow:0 18px 55px rgba(75,34,112,.12)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7efff,#fff 46%,#faf7fd);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:22px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:46px;height:46px;border-radius:15px}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.back{color:var(--p);text-decoration:none;border:1px solid var(--line);padding:10px 14px;border-radius:13px;background:#fff;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 26px rgba(75,34,112,.06)}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:30px;margin-top:8px;color:var(--p)}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.tools{display:flex;gap:10px;align-items:center;padding:15px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tools input,.tools select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;background:#fff}.tools input{flex:1;min-width:210px}.tools button{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:850;cursor:pointer}.tools button:disabled{opacity:.55;cursor:not-allowed}.translate-box{display:flex;align-items:center;gap:8px;padding:10px 15px;background:#fcf9ff;border-bottom:1px solid var(--line)}.translate-box label{font-size:13px;font-weight:800;color:var(--p)}.translate-box select{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff}.translate-status{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:right;padding:14px 16px;border-bottom:1px solid #f0e8f5;vertical-align:top}th{color:var(--muted);font-size:12px;background:#fcfafd;position:sticky;top:0}.badge{display:inline-block;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:850}.models{background:#eee4ff;color:#6331a4}.tools-badge{background:#e8f8f1;color:#147452}.other{background:#fff2dd;color:#9a5d00}.idea{max-width:470px;white-space:pre-wrap;line-height:1.7}.original-note{display:block;margin-top:5px;color:var(--muted);font-size:11px}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.loading{padding:40px;text-align:center;color:var(--muted)}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.brand h1{font-size:18px}}@media(max-width:460px){.stats{grid-template-columns:1fr}.back{font-size:12px}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand"><img src="./aiway-logo.png" alt="AiWay"><div><h1>لوحة إدارة الآراء</h1><p>آراء الزوار المجهولة مرتبة من الأحدث إلى الأقدم</p></div></div><a class="back" href="./index.html">الصفحة العامة ←</a></div>
<div class="stats"><div class="stat"><span>إجمالي المشاركات</span><b id="total">—</b></div><div class="stat"><span>كل نماذج الذكاء الاصطناعي</span><b id="models">—</b></div><div class="stat"><span>أدوات ذكاء اصطناعي بسيطة</span><b id="tools">—</b></div><div class="stat"><span>أفكار أخرى</span><b id="other">—</b></div></div>
<div class="panel">
<div class="tools"><input id="adminKey" type="password" autocomplete="current-password" placeholder="مفتاح دخول الإدارة"><input id="search" type="search" placeholder="ابحث في الأفكار أو اللغات..."><select id="filter"><option value="all">كل المشاركات</option><option value="all_models">كل نماذج الذكاء الاصطناعي</option><option value="simple_tools">أدوات ذكاء اصطناعي بسيطة</option><option value="other">أفكار أخرى</option></select><button id="refresh">تحديث البيانات</button></div>
<div class="translate-box"><label for="viewLanguage">عرض نصوص الآراء:</label><select id="viewLanguage"><option value="original">اللغة الأصلية</option><option value="ar">العربية</option></select><span class="translate-status" id="translateStatus"></span></div>
<div class="table-wrap"><div class="loading" id="state">أدخل مفتاح الإدارة ثم اضغط على تحديث البيانات.</div><table id="table" hidden><thead><tr><th>#</th><th>الاختيار</th><th>الرأي أو الفكرة</th><th>لغة الإرسال</th><th>التاريخ</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div>
<script>
let data=[];let translatedIdeas=new Map();
const state=document.getElementById('state'),table=document.getElementById('table'),rows=document.getElementById('rows'),viewLanguage=document.getElementById('viewLanguage'),translateStatus=document.getElementById('translateStatus');
function labelChoice(v,idea){if(v==='all_models')return['كل نماذج الذكاء الاصطناعي','models'];if(v==='simple_tools')return['أدوات ذكاء اصطناعي بسيطة','tools-badge'];return[idea?'فكرة أخرى':'بدون اختيار','other']}
function render(){const q=document.getElementById('search').value.toLowerCase().trim(),f=document.getElementById('filter').value;const filtered=data.filter(x=>{const isOther=!x.choice&&x.idea;const matchFilter=f==='all'||x.choice===f||(f==='other'&&isOther);const displayedIdea=viewLanguage.value==='ar'?(translatedIdeas.get(String(x.id))||x.idea||''):(x.idea||'');const text=(displayedIdea+' '+(x.idea||'')+' '+(x.language||'')).toLowerCase();return matchFilter&&(!q||text.includes(q))});rows.innerHTML='';filtered.forEach((x,i)=>{const [label,cls]=labelChoice(x.choice,x.idea);const tr=document.createElement('tr');tr.innerHTML=`<td>${i+1}</td><td><span class="badge ${cls}">${label}</span></td><td class="idea"></td><td>${escapeHtml(x.language||'—')}</td><td>${new Date(x.created_at).toLocaleString('ar-EG')}</td>`;const ideaCell=tr.querySelector('.idea');const translated=viewLanguage.value==='ar'?translatedIdeas.get(String(x.id)):null;ideaCell.textContent=translated||x.idea||'—';if(translated&&x.idea&&translated!==x.idea){const note=document.createElement('span');note.className='original-note';note.textContent='تمت الترجمة آليًا من النص الأصلي';ideaCell.appendChild(note)}rows.appendChild(tr)});state.style.display=filtered.length?'none':'block';state.textContent=filtered.length?'':'لا توجد نتائج مطابقة.';table.hidden=!filtered.length}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function translateAllToArabic(){if(!data.length){viewLanguage.value='original';return}const adminKey=document.getElementById('adminKey').value.trim();if(!adminKey){viewLanguage.value='original';state.style.display='block';state.textContent='أدخل مفتاح الإدارة أولًا.';return}const missing=data.filter(x=>x.idea&&!translatedIdeas.has(String(x.id)));if(!missing.length){render();return}viewLanguage.disabled=true;translateStatus.textContent='جاري ترجمة الآراء إلى العربية...';try{const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({action:'translate',target:'ar',items:missing.map(x=>({id:String(x.id),text:x.idea}))})});const body=await r.json().catch(()=>({}));if(!r.ok)throw new Error(body.error||'تعذر تنفيذ الترجمة');(body.translations||[]).forEach(item=>translatedIdeas.set(String(item.id),item.text));translateStatus.textContent='تمت ترجمة الآراء إلى العربية.';render()}catch(e){console.error(e);viewLanguage.value='original';translateStatus.textContent=e.message==='Unauthorized'?'مفتاح الإدارة غير صحيح.':'تعذر ترجمة الآراء حاليًا.';render()}finally{viewLanguage.disabled=false}}
async function load(){const adminKey=document.getElementById('adminKey').value.trim();if(!adminKey){state.style.display='block';state.textContent='أدخل مفتاح الإدارة ثم اضغط على تحديث البيانات.';table.hidden=true;return}state.style.display='block';state.textContent='جاري تحميل الآراء...';table.hidden=true;translateStatus.textContent='';translatedIdeas.clear();viewLanguage.value='original';try{const r=await fetch('/api/feedback',{headers:{'x-admin-key':adminKey}});if(!r.ok){const body=await r.json().catch(()=>({}));throw new Error(body.error||'فشل الطلب')}data=await r.json();document.getElementById('total').textContent=data.length;document.getElementById('models').textContent=data.filter(x=>x.choice==='all_models').length;document.getElementById('tools').textContent=data.filter(x=>x.choice==='simple_tools').length;document.getElementById('other').textContent=data.filter(x=>!x.choice&&x.idea).length;render()}catch(e){console.error(e);state.textContent=e.message==='Unauthorized'?'مفتاح الإدارة غير صحيح.':'تعذر تحميل الآراء.'}}
document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('refresh').onclick=load;document.getElementById('adminKey').addEventListener('keydown',e=>{if(e.key==='Enter')load()});viewLanguage.onchange=()=>viewLanguage.value==='ar'?translateAllToArabic():render();
</script></body></html>
